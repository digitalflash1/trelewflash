# Una página por evento en e/<id>/, solo para la vista previa al compartir.
#
# Facebook y WhatsApp no ejecutan el JavaScript de la tienda: leen las
# etiquetas og: del HTML tal como llega. Como la tienda es una sola página,
# todo enlace mostraba la vista previa general. Cada e/<id>/index.html trae
# el título y la portada de SU evento y, al abrirla una persona, la manda a
# «?ver=eventos&evento=<id>». Las arma .github/scripts/paginas-eventos.ps1,
# que de paso rearma sitemap.xml (home + una entrada por evento) para que
# Google las encuentre: no tienen enlaces internas entre sí.
#
# Los eventos viven en la hoja, así que las páginas se rearman solas cada
# hora (y a mano desde Actions → «Páginas de eventos» → Run workflow).
# Mientras un evento nuevo no tiene su página, el enlace igual anda: lo
# resuelve 404.html, con la vista previa general.
#
# ⚠️ Este workflow sube commits a main: antes de hacer push desde la compu,
# «git pull --rebase --autostash».

name: Páginas de eventos

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/paginas-eventos.yml"
      - ".github/scripts/paginas-eventos.ps1"

permissions:
  contents: write

concurrency:
  group: paginas-eventos
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bajar los eventos de la hoja
        run: |
          # Apps Script frío suele fallar la primera vez: tres intentos.
          for i in 1 2 3; do
            curl -fsSL --max-time 60 -o "$RUNNER_TEMP/eventos.json" \
              "https://script.google.com/macros/s/AKfycbxxkTt_esCqor3id4ZTcbav0uB7chR7QBFqwuxLPTmg_6pe6HfcPX4f0r0QBDrI0YkL5Q/exec?accion=eventos" \
              && exit 0
            sleep 10
          done
          exit 1

      - name: Armar las páginas
        shell: pwsh
        run: ./.github/scripts/paginas-eventos.ps1 "$env:RUNNER_TEMP/eventos.json" e

      - name: Subir si cambió algo
        run: |
          git add -A e sitemap.xml
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Páginas de vista previa de los eventos"
          git pull --rebase
          git push
